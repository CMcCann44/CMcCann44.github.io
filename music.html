<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music - Colin McCann</title>
  <link rel="icon" type="image/png" href="images/CM_blue_fill.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #13161d;
      --border: #1e2330;
      --accent: #4a7cff;
      --accent2: #7af0c0;
      --text: #e8eaf0;
      --muted: #7a8099;
      --heading-font: 'Playfair Display', serif;
      --mono-font: 'IBM Plex Mono', monospace;
      --body-font: 'IBM Plex Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body-font);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    header {
      padding: 6rem 0 4rem;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.8s ease both;
    }

    .tag {
      font-family: var(--mono-font);
      font-size: 0.75rem;
      color: var(--accent2);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: var(--heading-font);
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--text) 60%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .coming-soon {
      margin-top: 4rem;
      padding: 4rem 2rem;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      animation: fadeUp 0.8s ease 0.15s both;
    }

    .coming-soon p {
      font-family: var(--mono-font);
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.75rem;
    }

    .back {
      display: inline-block;
      margin-top: 2rem;
      font-family: var(--mono-font);
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }

    .back:hover {
      color: var(--accent2);
      border-color: var(--accent2);
    }

    footer {
      padding: 3rem 0;
      text-align: center;
    }

    footer p {
      font-family: var(--mono-font);
      font-size: 0.75rem;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <p class="tag">Colin McCann</p>
    <h1>Music</h1>
  </header>

  <div class="coming-soon">
    <h2 style="font-family: var(--heading-font); font-size: 1.8rem; color: var(--muted);">Coming Soon</h2>
    <p>Check back later for updates.</p>
    <a class="back" href="index.html">← Back to Projects</a>
  </div>

  <footer>
    <p>Colin McCann · <a href="index.html" style="color: var(--accent); text-decoration: none;">Projects</a></p>
  </footer>

</div>
</body>
</html>
